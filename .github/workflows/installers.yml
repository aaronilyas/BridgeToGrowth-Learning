name: installers

# Keeps install.sh, install.ps1 and install.cmd attached to the "installers" release, so the README
# can link to them as direct downloads. The scripts fetch the latest source from main when they run,
# so the release's tag does not need to move.
on:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, install.cmd, .github/workflows/installers.yml]
  pull_request:
    paths: [install.sh, install.ps1, install.cmd, .github/workflows/installers.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: installers-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check script syntax
        run: |
          sh -n install.sh
          bash -n install.sh
          pwsh -NoProfile -Command '$e = $null; [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e) | Out-Null; if ($e) { $e; exit 1 }'
      - name: Publish to the installers release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view installers >/dev/null 2>&1; then
            gh release create installers --target "$GITHUB_SHA" --title "Installers" --latest=false \
              --notes "Download the installer for your system. It installs the prerequisites, downloads the latest source from main, and builds the app. Windows: install.cmd (double-click). macOS and Linux: install.sh (run: sh install.sh). See the README for details."
          fi
          gh release upload installers install.sh install.ps1 install.cmd --clobber
