name: desktop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.4.4
      - name: Linux libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-bin
      - run: bun install --frozen-lockfile
      - name: Desktop build
        run: bun run desktop:build
      - name: Linux AppImage and deb
        if: runner.os == 'Linux'
        run: bun scripts/package-linux.ts
      # TODO: code signing (Developer ID on macOS, Authenticode on Windows, optional dpkg-sig on Linux)
      - name: Code signing
        run: "echo 'TODO - code signing is not configured'"
      # TODO: notarization (macOS notarytool submit + stapler)
      - name: Notarization
        if: runner.os == 'macOS'
        run: "echo 'TODO - notarization is not configured'"
      # TODO: auto-update (Electrobun updater channel once artifacts are signed)
      - name: Auto-update
        run: "echo 'TODO - auto-update is not configured'"
