name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: btg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d btg_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      APP_ORIGIN: http://localhost:3000
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/btg_test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/btg_test
      OPENROUTER_API_KEY: ci
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      OPENROUTER_MODEL: openrouter/free
      OPENALEX_MAILTO: ci@example.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
      - run: bun install --frozen-lockfile
      - run: bun run migrate "$TEST_DATABASE_URL"
      - run: bun run typecheck && bun test
