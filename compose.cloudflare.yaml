# Loaded automatically by the operator only for a public deployment.
services:
  coordinator:
    networks: [ingress]
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    # UID 0 reads the 0600 bind; no capabilities, socket or other credentials.
    user: "0:0"
    command: [tunnel, --no-autoupdate, --loglevel, warn, run, --token-file, /run/secrets/tunnel-token]
    volumes:
      - type: bind
        source: ./.local/backend/connector-token
        target: /run/secrets/tunnel-token
        read_only: true
        bind:
          create_host_path: false
    networks: [ingress]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    labels:
      io.btg.deployment: ${BTG_DEPLOYMENT_ID:?Run start-backend.sh}
    stop_grace_period: 1m
networks:
  ingress:
