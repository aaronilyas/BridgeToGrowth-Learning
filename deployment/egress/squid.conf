# CONNECT only; no arbitrary HTTP, IP literal, private/control-service access.
http_port 127.0.0.1:3128
acl CONNECT method CONNECT
acl tls_port port 443
# Do not reverse-resolve IP literals into allowed hostnames or wait on their DNS.
acl required_hosts dstdomain -n generativelanguage.googleapis.com translate.google.com translate.googleapis.com translate.googleusercontent.com
acl private_dst dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.88.99.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 2001:db8::/32 fc00::/7 fe80::/10 ff00::/8
http_access deny !CONNECT
http_access deny !tls_port
http_access deny !required_hosts
http_access deny private_dst
http_access allow required_hosts
http_access deny all
cache deny all
cache_dir null /tmp
access_log none
cache_log /dev/null
cache_store_log none
pid_filename /tmp/squid.pid
coredump_dir /tmp
shutdown_lifetime 1 seconds
